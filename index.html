<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f1ed">
  <meta name="description" content="Explore the Hexapod, follow a single leg and open the electronics stack in three interactive chapters.">
  <title>Hexapod · Orbital study · Annora</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f4f4f0'/%3E%3Cellipse cx='32' cy='32' rx='26' ry='14' transform='rotate(-32 32 32)' fill='none' stroke='%23303230' stroke-width='3'/%3E%3Ccircle cx='50' cy='16' r='6' fill='%23ff6037'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-CfTWaPre.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/graphics-BS-U-1OT.js">
  <link rel="stylesheet" crossorigin href="./assets/index-D-mDuxpc.css">
</head>
<body data-chapter="overview">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-arrow-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 6v12m8-12v12" stroke-width="2.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4.5 10a8 8 0 1 1 1.8 7.3M4.5 4.5V10H10"/></symbol>
    <symbol id="i-credit" viewBox="0 0 24 24"><path d="M7 17 17 7m-9 0h9v9"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>
  <header class="mast">
    <div class="identity"><span class="brand">Annora</span><h1>Hexapod</h1></div>
    <div class="mast-nav">
      <button id="back-overview" class="quiet-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-arrow-back"/></svg>Whole model</button>
      <details id="chapter-menu" class="chapter-menu">
        <summary id="index-trigger">Chapters<svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
        <nav id="chapter-list" aria-label="Chapter index">
          <button type="button" data-index-target="overview" aria-current="step">Whole model</button>
          <button type="button" data-index-target="leg">Leg motion</button>
          <button type="button" data-index-target="electronics">Electronics</button>
        </nav>
      </details>
    </div>
  </header>
  <main class="workspace">
    <section class="visual-stage" aria-label="Interactive Hexapod assembly">
      <canvas id="scene" tabindex="0" aria-label="Hexapod 3D view. Drag or use arrow keys to rotate. Pinch, scroll or use plus and minus to zoom."></canvas>
      <div id="status" role="status">Loading model…</div>
      <noscript><div class="noscript">Enable JavaScript to explore this model.</div></noscript>
    </section>
    <section class="chapter-dock" aria-label="Study controls">
      <div class="chapter-story">
        <span id="study-path" hidden>Hexapod <span aria-hidden="true">/</span> Front right leg</span>
        <h2 id="chapter-heading" tabindex="-1"></h2>
        <p id="chapter-copy"></p>
        <div id="track-comparison" role="group" aria-label="Compare orbit navigation" hidden>
          <span class="study-label" aria-hidden="true">Tracks</span>
          <div class="track-choices">
            <button type="button" data-track-mode="single" aria-pressed="false">Single</button>
            <button type="button" data-track-mode="layered" aria-pressed="true">Layered</button>
          </div>
        </div>
      </div>
      <div class="deck">
        <div class="overview-deck">
          <p id="orbit-caption">Select a point on the orbit.</p>
          <button id="rotation" class="control-button" type="button" aria-pressed="true">
            <span class="transport-icon"><svg class="icon" aria-hidden="true"><use class="if-rotating" href="#i-pause"/><use class="if-still" href="#i-play"/></svg></span><span data-label>Pause rotation</span>
          </button>
        </div>
        <div class="action-deck">
          <div class="play-line"><button id="playback" class="control-button" type="button" data-mode="play">
            <span class="transport-icon"><svg class="icon" aria-hidden="true"><use class="if-play" href="#i-play"/><use class="if-pause" href="#i-pause"/><use class="if-replay" href="#i-replay"/></svg></span><span data-label>Play action</span>
          </button><span id="chapter-phase"></span></div>
          <div class="scrub-line"><input id="progress" type="range" aria-label="Action progress" min="0" max="1000" value="0" step="1"><output id="timecode" for="progress">0.0 s</output></div>
          <div id="pose-choices" role="group" aria-label="Jump to a leg pose" hidden></div>
        </div>
      </div>
      <a class="credits-link" href="./LICENSES.txt" target="_blank" rel="noopener" aria-label="Model credits and licenses">Credits<svg class="icon" aria-hidden="true"><use href="#i-credit"/></svg></a>
    </section>
  </main>
</body>
</html>
